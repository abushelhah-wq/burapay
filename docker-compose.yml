# BuraPay Gateway Benchmark — behind the VPS's existing Traefik.
#
#   cd /opt/burapay && cp .env.example .env   # then fill in the secrets
#   ./scripts/inspect-traefik.sh              # prints the values this file needs
#   docker compose build
#   docker compose up -d
#   curl https://busrapay.com/api/health
#
#   Internet → Traefik (already running; not started, configured or restarted here)
#                 ├── Host(busrapay.com) && PathPrefix(/api) → backend  :8000
#                 └── Host(busrapay.com)                     → frontend :80
#                                                                 backend → postgres
#
# Networks, and why there are two
# -------------------------------
# `web` is an ordinary bridge. Traefik discovers containers through the Docker
# provider and connects to them by their address on this network. That works whether
# Traefik runs in host network mode — as it does on this VPS — or in a shared Docker
# network; for the shared case, add the override described in nginx-free deployment
# notes in the README:
#
#     docker compose -f docker-compose.yml -f docker-compose.traefik-network.yml up -d
#
# `internal` is marked internal: true, so it has no route to or from the internet.
# PostgreSQL lives there alone with the backend and is additionally labelled
# traefik.enable=false, because a database behind a reverse proxy is a database on the
# internet.
#
# Nothing publishes a host port. The only way in is through Traefik.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-burapay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burapay} -d ${POSTGRES_DB:-burapay}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=false"
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-burapay}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-burapay}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://busrapay.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://busrapay.com}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@busrapay.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-true}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      # Sandbox only unless this is deliberately turned on.
      ALLOW_PRODUCTION_GATEWAYS: ${ALLOW_PRODUCTION_GATEWAYS:-false}
      BENCHMARK_MIN_INTERVAL_SECONDS: ${BENCHMARK_MIN_INTERVAL_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_REGION: ${SERVER_REGION:-}
    expose:
      - "8000"
    # `web` carries Traefik's traffic and the outbound calls to the payment gateways;
    # `internal` carries PostgreSQL and nothing else.
    networks: [internal, web]
    labels:
      - "traefik.enable=true"
      # Required, because this container is on two networks: without it Traefik can
      # pick the internal address, which it cannot reach, and the route fails.
      - "traefik.docker.network=${BURAPAY_WEB_NETWORK:-burapay_web}"

      # No StripPrefix middleware anywhere. FastAPI is mounted at /api through its
      # root_path, so /api/health, /api/docs and /api/v1/... are its real paths and
      # Traefik forwards each request unchanged — which is why /api/api/... cannot
      # arise.
      - "traefik.http.routers.burapay-api.rule=Host(`${DOMAIN:-busrapay.com}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.burapay-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.burapay-api.tls=true"
      - "traefik.http.routers.burapay-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      # Higher than the frontend's router, which matches the same host with no path.
      - "traefik.http.routers.burapay-api.priority=100"
      - "traefik.http.services.burapay-api.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${BURAPAY_WEB_NETWORK:-burapay_web}"

      - "traefik.http.routers.burapay-web.rule=Host(`${DOMAIN:-busrapay.com}`)"
      - "traefik.http.routers.burapay-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.burapay-web.tls=true"
      - "traefik.http.routers.burapay-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.burapay-web.priority=1"
      - "traefik.http.services.burapay-web.loadbalancer.server.port=80"

volumes:
  postgres-data:

networks:
  # Named explicitly rather than left to Docker's <project>_web, so the
  # traefik.docker.network label above is predictable regardless of which directory
  # this was cloned into.
  web:
    name: ${BURAPAY_WEB_NETWORK:-burapay_web}
    driver: bridge

  # internal: true means Docker attaches no route to the internet, so PostgreSQL is
  # unreachable from outside even if a port were published by mistake.
  internal:
    driver: bridge
    internal: true
