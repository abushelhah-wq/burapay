<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}busrapay{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/checkout">busrapay</a>
    <nav>
      <a href="/checkout" {% if active == 'checkout' %}class="on"{% endif %}>Run a checkout</a>
      <a href="/results" {% if active == 'results' %}class="on"{% endif %}>Results</a>
      <a href="/api/docs">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Measuring merchant-server round trips only. Webhooks are acknowledged but
    never counted &mdash; the merchant neither initiates nor controls them.</span>
  </footer>
</body>
</html>
