name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Tests
        working-directory: backend
        # The suite runs against SQLite; no PostgreSQL service is needed, and the
        # models are written so both backends behave identically.
        env:
          APP_ENV: test
        run: pytest -q

  migrations:
    name: Migrations apply to PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: burapay
          POSTGRES_PASSWORD: burapay
          POSTGRES_DB: burapay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U burapay"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://burapay:burapay@localhost:5432/burapay
          APP_SECRET_KEY: ci-secret
          ENCRYPTION_KEY: ci-encryption-key-not-used-for-real-data
        run: alembic upgrade head

      - name: Verify the migration matches the models
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://burapay:burapay@localhost:5432/burapay
          APP_SECRET_KEY: ci-secret
          ENCRYPTION_KEY: ci-encryption-key-not-used-for-real-data
        # A model change with no accompanying migration is caught here rather than at
        # deploy time, when the schema is already live.
        run: |
          alembic check

  frontend:
    name: Frontend — lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check and build
        working-directory: frontend
        run: npm run build

      - name: Tests
        working-directory: frontend
        run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: burapay-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: burapay-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose file
        env:
          POSTGRES_PASSWORD: ci
          APP_SECRET_KEY: ci
          ENCRYPTION_KEY: ci
          BOOTSTRAP_ADMIN_PASSWORD: ci
        run: docker compose config --quiet

      - name: Check the Traefik wiring
        env:
          POSTGRES_PASSWORD: ci
          APP_SECRET_KEY: ci
          ENCRYPTION_KEY: ci
          BOOTSTRAP_ADMIN_PASSWORD: ci
        # The deployment contract, asserted against the rendered configuration: the
        # database never reaches the Traefik network, nothing publishes a host port,
        # the API router outranks the catch-all frontend router, and no StripPrefix
        # middleware exists — FastAPI serves /api itself, so stripping it here is what
        # produces /api/api/v1/... in production.
        run: |
          pip install pyyaml
          docker compose config > /tmp/rendered-compose.yml
          python3 scripts/check_traefik_wiring.py /tmp/rendered-compose.yml

      - name: Check the inspection script
        run: bash -n scripts/inspect-traefik.sh
