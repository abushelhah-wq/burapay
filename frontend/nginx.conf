# Static file serving for the built front end. The public-facing nginx in front of
# this container is what terminates TLS and routes /api to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset filenames carry a content hash, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current asset hashes,
    # and a stale copy would keep serving a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /transactions/abc is a React route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
