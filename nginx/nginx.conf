# Public-facing reverse proxy for busrapay.com.
#
#   /            → the React front end
#   /api/        → FastAPI
#   /api/docs    → OpenAPI documentation
#   /api/webhooks/{gateway} → gateway callbacks
#
# This file is a template: ${DOMAIN} is substituted by the nginx image's envsubst
# entrypoint at container start, so the same file works for any domain.

upstream burapay_backend {
    server backend:8000;
}

upstream burapay_frontend {
    server frontend:80;
}

# Plain HTTP: serve the ACME challenge, redirect everything else.
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Certbot writes its challenge files here; this must stay reachable over HTTP or
    # renewal fails silently and the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Gateways POST webhook bodies here; nothing legitimate is large.
    client_max_body_size 2m;

    access_log /var/log/nginx/burapay.access.log;
    error_log  /var/log/nginx/burapay.error.log warn;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The API, including /api/docs and /api/webhooks/{gateway}. The backend is mounted
    # at /api via FastAPI's root_path, so the prefix is passed through unchanged.
    location /api/ {
        proxy_pass http://burapay_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        # A benchmark run against a slow sandbox can legitimately take a while; the
        # gateway timeout the application applies is the one that should fire first.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://burapay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
