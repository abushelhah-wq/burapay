# Override for hosts where Traefik runs in its OWN Docker network rather than in
# host network mode.
#
#     docker compose -f docker-compose.yml -f docker-compose.traefik-network.yml up -d
#
# Set TRAEFIK_NETWORK in .env to that network's name first — ./scripts/inspect-traefik.sh
# prints it. The network is declared external, so this project never creates,
# renames or removes the one Traefik already owns; a wrong name fails immediately
# rather than starting a stack Traefik cannot see.
#
# The base file needs NO override on a host where Traefik uses host networking,
# which is the more common arrangement on a single VPS: a host-mode Traefik
# reaches these containers on the bridge directly. All the router labels live in
# the base file; this only changes which network Traefik should route over.

services:
  app:
    networks: [default, web, traefik]
    labels:
      - "traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}"

  frontend:
    networks: [web, traefik]
    labels:
      - "traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}
