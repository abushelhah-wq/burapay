[pytest]
testpaths = tests
asyncio_mode = auto

# One event loop for the whole session. The application creates its database
# engine once per process, and asyncpg connections are bound to the loop that
# opened them -- a fresh loop per test would hand every test a pool full of
# connections belonging to a loop that no longer exists.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::DeprecationWarning:starlette.*
